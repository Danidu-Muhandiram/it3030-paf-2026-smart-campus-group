server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartcampus
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_CLIENT_ID
            client-secret: YOUR_SECRET